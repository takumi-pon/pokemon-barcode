<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ポケモン バーコードスキャナー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div id="scanner" aria-label="カメラ映像"></div>
    <div class="shade" aria-hidden="true"></div>

    <section id="scan-ui" class="scan-ui" aria-live="polite">
      <div class="message" id="message">バーコードを<br>きいろい わくに<br>うつしてね！</div>
      <div class="scan-frame" aria-hidden="true">
        <span class="scan-line"></span>
      </div>
      <div class="progress" id="progress">● ○ ○</div>
    </section>

    <button id="scan-dex-button" class="floating-dex-button" type="button">ずかん</button>

    <section id="start-panel" class="panel">
      <div class="panel-card">
        <div class="pokeball" aria-hidden="true"></div>
        <h1>バーコードを<br>みつけよう！</h1>
        <button id="start-button" type="button">カメラを<br>はじめる</button>
        <button class="dex-button secondary-button" type="button">ずかん</button>
        <p>カメラを「許可」してね</p>
      </div>
    </section>

    <section id="result-panel" class="panel hidden" aria-live="assertive">
      <div class="result-card">
        <p class="success">みつけた！</p>
        <div id="pokemon-loading" class="pokemon-status">
          <div class="searching-ball" aria-hidden="true"></div>
          <p>ポケモンを<br>さがしてるよ…</p>
        </div>

        <div id="pokemon-result" class="pokemon-result hidden">
          <img id="pokemon-image" class="pokemon-image" alt="">
          <p id="pokemon-name" class="pokemon-name"></p>
          <p id="pokemon-number" class="pokemon-number"></p>
          <div id="pokemon-types" class="pokemon-types" aria-label="タイプ"></div>
          <p id="result-code" class="result-code"></p>
          <p id="encounter-message" class="encounter-message"></p>
          <button id="get-button" class="get-button" type="button">GET！</button>
          <p id="save-message" class="save-message" role="status"></p>
        </div>

        <div id="pokemon-error" class="pokemon-status pokemon-error hidden">
          <p>ポケモンを<br>みつけられなかったよ</p>
          <p id="pokemon-error-message" class="error-detail"></p>
        </div>

        <div id="result-actions" class="result-actions hidden">
          <button class="dex-button" type="button">ずかん</button>
          <button id="restart-button" type="button">もういちど</button>
        </div>
      </div>
    </section>

    <section id="catch-overlay" class="catch-overlay hidden" aria-live="assertive">
      <div id="catch-ball" class="catch-ball" aria-hidden="true"></div>
      <p id="catch-count" class="catch-count"></p>
      <p id="caught-message" class="caught-message"></p>
    </section>

    <section id="dex-panel" class="dex-panel hidden" aria-labelledby="dex-title">
      <header class="dex-header">
        <div>
          <p class="dex-kicker">ポケモン</p>
          <h2 id="dex-title">ずかん</h2>
          <p id="dex-progress" class="dex-progress">GET 0 / 1025 ・ ✨ 0</p>
        </div>
        <button id="dex-back-button" class="dex-back-button" type="button">もどる</button>
      </header>
      <p id="dex-storage-message" class="dex-storage-message" role="status"></p>
      <div id="dex-grid" class="dex-grid"></div>
    </section>

    <section id="error-panel" class="panel hidden" aria-live="assertive">
      <div class="panel-card error-card">
        <h2>カメラを<br>つかえなかったよ</h2>
        <p id="error-message">Safariの設定で<br>カメラを許可してね</p>
        <button id="retry-button" type="button">もういちど</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.12.1/dist/quagga.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
