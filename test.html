<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><title>scanner tests</title></head>
<body><div id="start-panel"></div><div id="result-panel" class="hidden"></div><div id="error-panel" class="hidden"></div><div id="dex-panel" class="hidden"></div><div id="catch-overlay" class="hidden"></div><div id="result-code"></div><div id="progress"></div><div id="pokemon-loading"></div><div id="pokemon-result"></div><div id="pokemon-error"></div><div id="pokemon-error-message"></div><div id="result-actions"></div><div id="encounter-message"></div><div id="save-message"></div><div id="catch-count"></div><div id="caught-message"></div><div id="catch-ball"></div><div id="dex-progress"></div><div id="dex-grid"></div><div id="dex-storage-message"></div><img id="pokemon-image"><div id="pokemon-name"></div><div id="pokemon-number"></div><div id="pokemon-types"></div><button id="start-button"></button><button id="retry-button"></button><button id="restart-button"></button><button id="get-button"></button><button id="scan-dex-button"></button><button id="dex-back-button"></button><div id="scanner"></div>
<script>window.Quagga={onDetected(){},init(){},start(){},stop(){}};</script>
<script src="app.js"></script>
<script>
  (async () => {
    const t = window.BarcodeScannerTest;
    const cases = [
      ["4901234567894", true],
      ["4901234567890", false],
      ["55123457", true],
      ["55123458", false],
      ["abc", false]
    ];
    const failures = cases.filter(([code, expected]) => t.hasValidEanCheckDigit(code) !== expected);

    t.resetHits();
    const sequence = [
      t.registerDetection("4901234567894", 100),
      t.registerDetection("4901234567894", 200),
      t.registerDetection("4901234567894", 300)
    ];
    if (sequence.join() !== "false,false,true") failures.push(["three-hit confirmation", sequence]);

    const encounter = await t.barcodeToEncounter("4901234567894");
    if (encounter.pokemonId !== 949) failures.push(["SHA-256 mapping", encounter]);
    if (encounter.isShiny !== false || encounter.shinyRoll !== 48) failures.push(["shiny mapping", encounter]);
    if (t.constants.MAX_POKEMON_ID !== 1025 || t.constants.SHINY_RATE_PERCENT !== 2) failures.push(["constants", t.constants]);

    const beforeRecord = t.readCaughtPokemon()["949"] || {};
    const beforeCount = Number(beforeRecord.count) || 0;
    const beforeShinyCount = Number(beforeRecord.shinyCount) || 0;
    const testPokemon = {
      pokemonId: 949,
      nameJa: "テストポケモン",
      imageUrl: "https://example.test/949.png",
      normalImageUrl: "https://example.test/949.png",
      shinyImageUrl: "https://example.test/949-shiny.png",
      typesJa: ["くさ"],
      isShiny: false
    };
    const shinyPokemon = { ...testPokemon, imageUrl: testPokemon.shinyImageUrl, isShiny: true };

    const firstSave = t.saveCaughtPokemon(testPokemon);
    const shinySave = t.saveCaughtPokemon(shinyPokemon);
    if (!firstSave.saved || firstSave.record.count !== beforeCount + 1) failures.push(["normal localStorage save", firstSave]);
    if (!shinySave.saved || shinySave.record.count !== beforeCount + 2) failures.push(["shiny localStorage save", shinySave]);
    if (shinySave.record.shinyCount !== beforeShinyCount + 1) failures.push(["shiny count", shinySave.record]);
    if (!shinySave.record.firstCaughtAt || !shinySave.record.firstShinyCaughtAt) failures.push(["saved timestamps", shinySave.record]);

    t.renderDex();
    if (document.querySelectorAll(".dex-card").length !== 1025) failures.push(["Pokedex card count", document.querySelectorAll(".dex-card").length]);
    if (!document.getElementById("dex-progress").textContent.includes("/ 1025")) failures.push(["Pokedex progress", document.getElementById("dex-progress").textContent]);

    t.renderPokemon(testPokemon);
    document.getElementById("get-button").click();
    await new Promise((resolve) => setTimeout(resolve, 3000));
    const caughtThroughButton = t.readCaughtPokemon()["949"];
    if (caughtThroughButton.count !== beforeCount + 3) failures.push(["GET button count", caughtThroughButton.count]);
    if (!document.getElementById("get-button").disabled) failures.push(["GET button duplicate guard"]);
    if (document.getElementById("caught-message").textContent !== "つかまえた！") failures.push(["catch animation message"]);

    document.body.dataset.result = failures.length ? "fail" : "pass";
    document.body.textContent = failures.length ? JSON.stringify(failures) : "PASS";
  })();
</script></body></html>
